import java.util.regex.Matcher
import java.util.regex.Pattern

apply plugin: 'com.android.library'

android {
    compileSdkVersion PROP_COMPILE_SDK_VERSION.toInteger()

    aaptOptions {
        noCompress ".zip", ".pkg"
    }

    defaultConfig {
        minSdkVersion PROP_MIN_SDK_VERSION
        targetSdkVersion PROP_TARGET_SDK_VERSION
        versionCode Integer.parseInt(VERSION_CODE)
        versionName VERSION_NAME

        resValue "drawable", "app_splash", "@drawable/splash"
        
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_FIND_ROOT_PATH=", "-DANDROID_STL=c++_shared", "-DANDROID_TOOLCHAIN=clang", "-DANDROID_ARM_NEON=TRUE", "-DANDROID_STUDIO=TRUE", "-DNPLRUNTIME_OCE=TRUE", "-DHB_HAVE_FREETYPE=ON"
                cppFlags "-frtti -fexceptions -fsigned-char -std=c++17"
            }
        }
    }

    ndkVersion='23.1.7779620'

    sourceSets.main {
        java.srcDir "../app/java"
        res.srcDir "../app/res"
        manifest.srcFile "AndroidManifest.xml"
        assets.srcDirs = ["../app/assets"]
    }

    externalNativeBuild {
        cmake {
            version CMAKE_VERSION
            path "../../../CMakeLists.txt"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "abi"

    productFlavors {
        /* ABI */
        abiDefault {
            ndk {
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
            dimension "abi"
        }

        arm64V8a {
            ndk {
                abiFilters "arm64-v8a"
            }
            dimension "abi"
        }

        armeabiV7a {
            ndk {
                abiFilters "armeabi-v7a"
            }
            dimension "abi"
        }
    }

    // AAR输出配置
    libraryVariants.all { variant ->
        variant.outputs.all { output ->
            // def buildType = variant.buildType.name
            // def flavor = variant.flavorName
            def versionName = VERSION_NAME
            // def buildDate = new Date().format('yyyy-MM-dd-HH-mm-ss')
            
            outputFileName = "paracraft-core-${versionName}.aar"
        }
    }
}

dependencies {
    implementation fileTree(dir: '../app/libs', include: ['*.jar'])
    implementation 'org.jetbrains:annotations:17.0.0'
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'

    implementation 'com.github.smarxpan:NotchScreenTool:0.0.1'
    implementation ('com.shuyu:GSYVideoPlayer:8.1.2')
    implementation 'com.github.mik3y:usb-serial-for-android:3.6.0'
}

repositories {
    mavenCentral()
}
