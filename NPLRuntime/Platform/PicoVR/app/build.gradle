apply plugin: 'com.android.application'

// Java code, resources and assets are shared with the phone app.
def ANDROID_APP_DIR = "../../AndroidStudio/app"

// Boost built for android (<root>/android-build/stage/<abi>/lib). It overrides the BOOST_ROOT env, which may
// point to a desktop boost. Taken from -PANDROID_BOOST_ROOT=..., or android.boost.root in local.properties.
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def ANDROID_BOOST_ROOT = project.findProperty("ANDROID_BOOST_ROOT") ?: localProps.getProperty("android.boost.root")

android {
    namespace 'com.palaka.paracraft'
    compileSdkVersion PROP_COMPILE_SDK_VERSION.toInteger()

    aaptOptions {
        noCompress ".zip", ".pkg"
    }

    defaultConfig {
        applicationId "com.palaka.paracraft.vr"
        minSdkVersion PROP_MIN_SDK_VERSION
        targetSdkVersion PROP_TARGET_SDK_VERSION
        versionCode Integer.parseInt(VERSION_CODE)
        versionName VERSION_NAME
        resValue "drawable", "app_splash", "@drawable/splash"
        resValue "drawable", "app_icon", "@drawable/ic_launcher"
        resValue "string", "app_scheme", "paracraft"
        resValue "string", "app_name", "帕拉卡VR"
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_POLICY_VERSION_MINIMUM=3.5", "-DCMAKE_FIND_ROOT_PATH=", "-DANDROID_STL=c++_shared", "-DANDROID_TOOLCHAIN=clang", "-DANDROID_ARM_NEON=TRUE", "-DANDROID_STUDIO=TRUE", "-DPICO_VR=ON", "-DNPLRUNTIME_OCE=TRUE", "-DHB_HAVE_FREETYPE=ON"
                cppFlags "-frtti -fexceptions -fsigned-char -std=c++17"
                if (ANDROID_BOOST_ROOT) {
                    arguments "-DBOOST_ROOT=${ANDROID_BOOST_ROOT}"
                    // a source tree boost keeps headers in its root, not in include/
                    cppFlags "-isystem ${ANDROID_BOOST_ROOT}"
                }
            }
        }

        // all PICO headsets are arm64
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    ndkVersion='23.1.7779620'

    buildFeatures {
        // OpenXR loader is consumed as a prefab package by CMake
        prefab true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets.main {
        java.srcDirs = ["${ANDROID_APP_DIR}/java", "java"]
        res.srcDirs = ["${ANDROID_APP_DIR}/res"]
        manifest.srcFile "AndroidManifest.xml"
        assets.srcDirs = ["${ANDROID_APP_DIR}/assets"]
    }

    externalNativeBuild {
        cmake {
            version CMAKE_VERSION
            path "../../../CMakeLists.txt"
        }
    }

    signingConfigs {
       release {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
                enableV1Signing true
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.release
            }

            manifestPlaceholders = [libname: "Paracraft", CHANNEL_VALUE: "pico"]
        }

        debug {
            debuggable true
            jniDebuggable true
            manifestPlaceholders = [libname: "Paracraftd", CHANNEL_VALUE: "pico"]
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            def buildDate = new Date().format("yyyyMMdd")
            if (variant.buildType.name == "release") {
                outputFileName = "paracraftvr-relese-${VERSION_NAME}-${buildDate}.apk"
            } else {
                outputFileName = "paracraft-pico-${variant.buildType.name}-${VERSION_NAME}.apk"
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: "${ANDROID_APP_DIR}/libs", include: ['*.jar'])
    implementation 'org.jetbrains:annotations:17.0.0'
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'

    implementation 'com.github.smarxpan:NotchScreenTool:0.0.1'
    implementation ('com.shuyu:GSYVideoPlayer:8.1.2')
    implementation 'com.github.mik3y:usb-serial-for-android:3.6.0'

    implementation "org.khronos.openxr:openxr_loader_for_android:${OPENXR_LOADER_VERSION}"
}
