<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ParaCraft Web (Local Disk Unified)</title>
    <style type="text/css">
        html,
        body {
            height: 100%;
            margin: 0px;
            padding: 0px;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        #input {
            position: fixed;
            top: 0px;
            left: 0px;
            width: 100%;
            height: 30px;
            outline: none;
            border: none;
            z-index: -10;
            font-size: 20px;
        }

        #is-loading-full-overlay,
        .is-loading-element-overlay {
            background-color: rgba(0, 0, 0, 0);
        }

        #load-tiptext {
            background-color: #F3F5F9;
        }

        #fullScreenBtn {
            width: 100px;
            height: 30px;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid #fff;
            border-radius: 4px;
            color: #fff;
            text-align: center;
            display: none;
            cursor: pointer;
            z-index: 999;
        }

        #custom-loader {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <input type="text" id="input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="opacity: 0;" />
    <button id="fullScreenBtn">退出全屏</button>
    <div id="load-tiptext" style="visibility: visible; padding-top: 200px; color: rgb(80, 30, 80); display: flex; flex-direction: column; justify-content: center; align-items: center; position: absolute; left: 0px; right: 0px; top: 0px; bottom: 0px;">
        <h3 id="loadingTipText">
            正在从本地磁盘加载 Paracraft...
        </h3>
        <h4 id="loading-text">
            Made with Paracraft and NPL (Unified Emscripten)
        </h4>
    </div>
    <iframe id="custom-loader" src="" frameborder="0" allow="camera; microphone; autoplay; clipboard-read; clipboard-write; allow-downloads"></iframe>
    <script>
        (function () {
            const iframe = document.getElementById("custom-loader");
            if (iframe) iframe.remove();

            const hostname = window.location.hostname;
            const isLocalHost = hostname === "localhost" || hostname === "127.0.0.1";
            const basePrefix = isLocalHost ? "/npl/webparacraft/" : "/";

            window.WEBPARACRAFT_VERSION = "dev";
            window.WEBPARACRAFT_ORIGIN = window.location.origin + basePrefix;
            window.chrome_webview = window.chrome && window.chrome.webview;

            let bootCacheReady;
            if ("serviceWorker" in navigator) {
                const useRelativeSw = !isLocalHost;
                const currentUrl = new URL(window.location.href);
                const workerUrl = useRelativeSw
                    ? new URL("ServiceWorker", currentUrl)
                    : new URL("/ServiceWorker.js", currentUrl.origin);
                const workerScope = useRelativeSw ? new URL("./", currentUrl).pathname : "/";
                window.WEBPARACRAFT_SERVICE_WORKER_URL = workerUrl.href;
                window.WEBPARACRAFT_SERVICE_WORKER_SCOPE = workerScope;
                const sw = navigator.serviceWorker;
                const registration = sw.register(workerUrl.href);
                if (!sw.controller) {
                    // Give the first install a chance to retain the large initial downloads.
                    bootCacheReady = new Promise(resolve => {
                        function finish() {
                            clearTimeout(timer);
                            sw.removeEventListener("controllerchange", finish);
                            resolve();
                        }
                        const timer = setTimeout(finish, 1500);
                        sw.addEventListener("controllerchange", finish);
                        registration.catch(finish);
                    });
                } else {
                    registration.catch(() => {});
                }
            }

            const cssLink = document.createElement("link");
            cssLink.rel = "stylesheet";
            cssLink.type = "text/css";
            cssLink.href = window.WEBPARACRAFT_ORIGIN + "libs/isLoading.min.css";
            document.head.appendChild(cssLink);

            window.Module = typeof Module !== "undefined" ? Module : {};
            Module.locateFile = function (packageName) {
                return window.WEBPARACRAFT_ORIGIN + "auto_generate_files/" + packageName;
            };

            function loadScriptSequential(paths, done) {
                let idx = 0;
                function next() {
                    if (idx >= paths.length) {
                        if (done) done();
                        return;
                    }
                    const rel = paths[idx++];
                    const s = document.createElement("script");
                    s.src = window.WEBPARACRAFT_ORIGIN + rel;
                    s.async = false;
                    s.onload = next;
                    s.onerror = function (err) {
                        console.error("Failed to load script:", s.src, err);
                        next();
                    };
                    if (rel === engineJs && bootCacheReady) bootCacheReady.then(() => document.body.appendChild(s));
                    else document.body.appendChild(s);
                }
                next();
            }

            const urlParams = new URLSearchParams(window.location.search || "");
            const engineJs = urlParams.get("multithread") === "true"
                ? "auto_generate_files/ParaCraft.js"
                : "auto_generate_files/ParaCraftSingleThread.js";

            loadScriptSequential([
                "libs/isLoading.min.js",
                "libs/tone.min.js",
                "src/local_disk_fs.js",
                "src/index.js",
                "src/webview.js",
                "src/emscripten.js",
                "src/emscripten_api.js",
                engineJs,
            ]);
        })();
    </script>
</body>

</html>
